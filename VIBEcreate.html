<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - VIBE</title>
    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Create New Event</h2>

    <form action="events.php?action=add" method="POST">
        <div class="form-group">
            <label>Event ID</label>
            <input type="number" name="event_id" required>
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" name="event_location" required>
        </div>

        <div class="form-group">
            <label>Artists</label>
            <input type="text" name="artists" required>
        </div>

        <div class="form-group">
            <label>Event Type</label>
            <select name="event_type" required>
                <option value="concert">Concert</option>
                <option value="sports">Sports</option>
                <option value="conference">Conference</option>
                <option value="festival">Festival</option>


            </select>
        </div>

        <div class="form-group">
            <label>Date & Time</label>
            <input type="datetime-local" name="event_datetime" required>
        </div>

        <div class="form-group">
            <label>Venue Name</label>
            <input type="text" name="venue_name" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="event_description"></textarea>
        </div>

        <button type="submit" class="btn-create">Create Event</button>
        <a href="VIBEProfile.html" class="btn-cancel">Cancel</a>
    </form>
</div>
</body>
</html>
