<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Events - VIBE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .main-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 1400px;
            margin: 2rem auto;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            flex: 1;
            max-width: 600px;
        }

        .search-bar input {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border: 2px solid #f0f0f0;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .event-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .event-content {
            padding: 1.5rem;
        }

        .event-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .event-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .event-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .tag {
            padding: 0.3rem 0.8rem;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #667eea;
        }

        .event-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            flex: 1;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-view {
            background: #667eea;
            color: white;
        }

        .btn-save {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo"> VIBE</div>
    <ul class="nav-links">
        <li><a href="VIBEhome.html">Home</a></li>
        <li><a href="VIBEevents.html">Events</a></li>
        <li><a href="VIBEProfile.html">Profile</a></li>
        <li><a href="VIBEabout.html">About</a></li>
    </ul>
    <div class="auth-buttons">
        <button class="btn btn-secondary" onclick="window.location.href = 'VIBElogin.html' ">Login</button>
        <a href="logout.php" class="btn btn-logout">Logout</a>
    </div>
</nav>

<main class="main-content">
    <div class="header-section">
        <h2>Browse User Generated Events</h2>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Search events, artists, venues..." id="searchInput">
        <button class="btn btn-primary" onclick="searchEvents()">Search</button>
    </div>

    <div class="events-grid" id="eventsGrid">
    </div>
</main>

<script>


    // Handles user event loading.
    // Calls events.php to fetch event information
    // input to the Profile 'create event' page.
    // Andrew

    async function loadUserEvents() {
        try {
            const response = await fetch('events.php?action=list');
            const events = await response.json();

            const eventsGrid = document.getElementById('eventsGrid');
            eventsGrid.innerHTML = '';

            if (events.length === 0) {
                eventsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #666;">No events found. Create one to get started!</p>';
                return;
            }

            events.forEach(event => {
                const card = createUserEventCard(event);
                eventsGrid.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading events:', error);
            document.getElementById('eventsGrid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #c33;">Error loading events. Please refresh the page.</p>';
        }
    }

    // Boilerplate card styling from VIBEhome
    // Favorite button saves event to User profile.
    // Andrew

    function createUserEventCard(event) {
        const card = document.createElement('div');
        card.className = 'event-card';

        const imageUrl = event.image_url || 'VIBEbackground.avif';

        card.innerHTML = `
            <div class="event-content">
                <div class="event-image" style="background-image: url('${imageUrl}'); background-size: cover; background-position: center;"></div>
                <div class="event-title">${event.artists || 'Untitled Event'}</div>
                <div class="event-meta">
                    <span>📅 ${event.event_datetime}</span>
                    <span>📍 ${event.event_location}</span>
                    <span>🏢 ${event.venue_name}</span>
                </div>
                <div class="event-tags">
                    <span class="tag">${event.event_type}</span>
                    <span class="tag">User Event</span>
                </div>
                <div class="event-actions">
                    <button class="btn-small btn-view" onclick="viewEvent(${event.event_id})">View</button>
                    <button class="btn-small btn-save" onclick="addToFavorites(${event.event_id})">❤️ Favorite</button>
                </div>
            </div>
        `;

        return card;
    }

    // Implement favorite button.
    // Saves User generated events to User profile page
    // Andrew

    async function addToFavorites(eventId) {
        console.log('Adding event to favorites:', eventId);

        try {
            const formData = new FormData();
            formData.append('event_id', eventId);

            const response = await fetch('favorites.php?action=add', {
                method: 'POST',
                body: formData
            });


            // Handles Favorite button response.
            // Redirect to login page if not active user detected.
            // User can't favorite an event that's already favorited.

            const result = await response.text();
            const trimmedResult = result.trim();

            if (trimmedResult === 'FAVORITE_ADDED') {
                alert('Event added to favorites!');
            } else if (trimmedResult === 'NOT_LOGGED_IN') {
                alert('Please log in to favorite events');
                window.location.href = 'VIBElogin.php';
            } else if (trimmedResult === 'ALREADY_FAVORITED') {
                alert('This event is already in your favorites!');
            } else {
                alert('Failed to add to favorites.');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // Search User uploaded events only
    // based on event/artist/etc.
    // Andrew

    function searchEvents() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.event-card');

        cards.forEach(card => {
            const title = card.querySelector('.event-title').textContent.toLowerCase();
            const location = card.querySelector('.event-meta').textContent.toLowerCase();

            if (title.includes(query) || location.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }


    // Automatic event load on page submission
    // Andrew

    window.addEventListener('DOMContentLoaded', () => {
        loadUserEvents();
    });

</script>
</body>
</html>
